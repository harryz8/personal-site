<div id="sidebar" class="container-fluid">
    <div id="sidebar_inner" class="container-fluid center">
        <div class="row align-left" style="justify-content: center;">
            <ul>
                <li class="li-button" [ngClass]="{'li-button-selected': this.path === '/'}" routerLink="/">
                    <button #bt_1 class="side_button" type="button">
                        @if (this.path === '/') {*}
                        Profile
                    </button>
                </li>
                <li class="li-button" [ngClass]="{'li-button-selected': this.path === '/background'}" routerLink="/background">
                    <button #bt_1 class="side_button" type="button">
                        @if (this.path === '/background') {*}
                        Background
                    </button>
                </li>
                <li class="li-button" [ngClass]="{'li-button-selected': this.path === '/timeline'}" routerLink="/timeline">
                    <button #bt_1 class="side_button" type="button">
                        @if (this.path === '/timeline') {*}
                        Notebook
                    </button>
                </li>
            </ul>
        </div>
    </div>
</div>
